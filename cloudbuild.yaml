steps:
  # 0. Build API Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/api:$COMMIT_SHA",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/api:latest",
        "-f",
        "Dockerfile.api",
        ".",
      ]

  # 1. Push API Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/api"]

  # 2. Build Job Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/job:$COMMIT_SHA",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/job:latest",
        "-f",
        "Dockerfile.job",
        ".",
      ]

  # 3. Push Job Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/job"]

  # 4. Build Frontend Portal Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/portal:$COMMIT_SHA",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/portal:latest",
        "-f",
        "Dockerfile.frontend",
        ".",
      ]

  # 5. Push Frontend Portal Image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/portal"]

  # 6. Deploy Discovery Job to Cloud Run Jobs
  # Notice the --service-account flag linking the job to the Terraform-created SA
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "migration-discovery-job"
      - "--image"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/job:latest"
      - "--region"
      - "$_REGION"
      - "--service-account"
      - "migration-job-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,REPORTS_BUCKET=$PROJECT_ID-migration-reports'
      - '--command='
      - '--args='

      # 8. Deploy API Service to Cloud Run
  # Notice the --service-account flag linking the API to the Terraform-created SA
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "migration-api"
      - "--image"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/api:latest"
      - "--region"
      - "$_REGION"
      - "--service-account"
      - "migration-api-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--set-env-vars"
      - "PROJECT_ID=$PROJECT_ID,REPORTS_BUCKET=$PROJECT_ID-migration-reports,DISCOVERY_JOB_NAME=migration-discovery-job"
      - "--allow-unauthenticated"

  # 8. Deploy Portal Service to Cloud Run
  # We use bash to fetch the backend URL dynamically and pass it to the frontend NGINX proxy
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        API_URL=$$(gcloud run services describe migration-api --region=$_REGION --format='value(status.url)')
        echo "Retrieved backend API URL: $$API_URL"
        gcloud run deploy migration-portal \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/migration-repo/portal:latest \
          --region $_REGION \
          --allow-unauthenticated \
          --set-env-vars API_URL=$$API_URL

options:
  logging: CLOUD_LOGGING_ONLY
